{% load static %}
<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Page non trouvée</title>
    <style>
      body { font-family: system-ui, -apple-system, sans-serif; background: #f6f6f6; color: #1e1e1e; margin: 0; }
      .village-container { max-width: 70rem; margin: 0 auto; padding: 2rem 1.5rem; }
      .village-card { background: #fff; border: 1px solid #ddd; border-radius: 0.5rem; padding: 2rem; }
      h1 { font-size: 1.5rem; margin-top: 0; }
      .text-sm { font-size: 0.875rem; }
      .btn { display: inline-block; background: #00627a; color: #fff; text-decoration: none; padding: 0.5rem 1rem; border-radius: 0.25rem; margin-top: 1rem; }
      img { max-width: 100%; height: auto; }
    </style>
  </head>
  <body>
    <div class="village-container">
      <div class="village-card">
        <h1>Page non trouvée</h1>
        <p class="text-sm">Erreur 404</p>
        <p>La page que vous cherchez est introuvable. Veuillez nous excuser pour la gène occasionnée.</p>
        <p class="text-sm">
          Si vous avez tapé l’adresse web dans le navigateur, vérifiez qu’elle est correcte.
          La page n’est peut-être plus disponible.
        </p>
        <a class="btn" href="/">Page d’accueil</a>
      </div>
    </div>
  </body>
</html>
